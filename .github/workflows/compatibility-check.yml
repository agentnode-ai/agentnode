name: Compatibility Smoke Test

# Manual-only: the stored OPENROUTER_API_KEY is invalid, so the push trigger
# just painted every SDK merge red (and a valid key would burn OpenRouter
# credit on every push — the weekly cron was disabled 2026-06-17 for the same
# reason). Re-enable a trigger only together with a fresh, funded key.
on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openai httpx
          pip install -e sdk/

      - name: Run compatibility smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python sdk/scripts/ci_smoke_test.py
