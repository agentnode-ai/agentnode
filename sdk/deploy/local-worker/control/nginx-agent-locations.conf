# local-worker slice 2 -- the EXACT agent locations, included inside the `server_name mcp.agentnode.net` block of
# nginx-mcp.conf (Codex Q-LW2-0001 D1/D2/D14). NOT INSTALLED by default: without this include every /agent/* path
# falls through to rmcp-control, which answers 404, exactly as before slice 2. Nothing else of the vhost changes.
#
# AGENT_EDGE_SOCKET  rmcp-agent's edge socket (0660, group nginx)        default /run/rmcp-agent/edge.sock
# AGENT_HTTP         rmcp-agent's pairing routes on loopback              default 127.0.0.1:8810

# The slot: one HTTP/1.1 upgrade, the ORIGINAL authority passed on ($http_host, never the normalised $host), no body.
location = /agent/v1/slot {
    limit_conn agent_conn 64;
    limit_req zone=agent_slot burst=20 nodelay;
    limit_req_status 429;
    if ($request_method != GET) { return 405; }
    client_max_body_size 1k;
    proxy_pass http://unix:AGENT_EDGE_SOCKET;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 130s;            # above the agent's 110 s idle slot
    proxy_send_timeout 130s;
}

# Pairing (agent JSON) and the person's approval page; and an uninstalling agent's signed retirement request.
location = /agent/v1/pair/start      { limit_req zone=agent_pair burst=5 nodelay; limit_req_status 429; proxy_pass http://AGENT_HTTP; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
location = /agent/v1/pair/poll       { limit_req zone=agent_pair burst=20 nodelay; limit_req_status 429; proxy_pass http://AGENT_HTTP; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
location = /agent/v1/pair/ack        { limit_req zone=agent_pair burst=5 nodelay; limit_req_status 429; proxy_pass http://AGENT_HTTP; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
location = /agent/v1/device/retire   { limit_req zone=agent_pair burst=5 nodelay; limit_req_status 429; proxy_pass http://AGENT_HTTP; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
location = /agent/pair               { limit_req zone=agent_pair burst=10 nodelay; limit_req_status 429; proxy_pass http://AGENT_HTTP; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
