# Where the worker's socket lives, and the one place the two accounts meet.
#
# Owned by the worker, grouped to the bridge, and SETGID -- the setgid bit is doing real work
# here, not tidiness. A unix socket takes the primary group of the process that binds it, and the
# worker's primary group has to stay its own: rootless podman needs the account's real passwd
# group, and newuidmap refuses to map anything else. So the shared group reaches the socket
# through the directory or not at all.
#
# systemd's RuntimeDirectory= is deliberately not used for this: it would recreate the directory
# owned by the unit's User and Group on every start, and the group it needs is not the unit's.
d /run/agentnode 2750 agentnode-worker agentnode-bridge -
