name: Full checks

# THE full check of this repository, written once (task #30, PLAN-2026-11.md section 2).
# It is only ever CALLED: by nightly.yml on a schedule and by release.yml for a version tag.
# A pull request does not run it -- sdk.yml and backend.yml give fast PR feedback (task #13).
#
# Nothing in here may be skipped by a path filter or a condition: "nightly = everything" is a
# promise only while every part runs. sdk/tests/test_ci_full_lanes.py holds that.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk
    steps:
      # The whole history, as in sdk.yml: one test reads the commit messages that arrived.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  adapter-langchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapter-langchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ../sdk -e ".[dev]"
      - run: pytest -v

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.10
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentnode
          POSTGRES_PASSWORD: agentnode
          POSTGRES_DB: agentnode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://agentnode:agentnode@localhost:5432/agentnode_test
      REDIS_URL: redis://localhost:6379
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_KEY: masterKey
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: agentnode-artifacts
      S3_REGION: auto
      JWT_SECRET: test-secret-ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install -e ".[dev]" --no-deps
      - run: pip install pytest pytest-asyncio httpx
      - run: pytest -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentnode
          POSTGRES_PASSWORD: agentnode
          POSTGRES_DB: agentnode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://agentnode:agentnode@localhost:5432/agentnode_test
      JWT_SECRET: test-secret-ci
      ENVIRONMENT: test
      # scripts/smoke.py runs two pytest sessions, one per environment.
      SMOKE_BACKEND_PYTHON: ${{ github.workspace }}/backend-venv/bin/python
      SMOKE_SDK_PYTHON: ${{ github.workspace }}/sdk-venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv backend-venv && python -m venv sdk-venv
      - run: backend-venv/bin/pip install -r backend/requirements.lock
      - run: cd backend && ../backend-venv/bin/pip install -e ".[dev]" --no-deps
      - run: backend-venv/bin/pip install pytest pytest-asyncio httpx
      - run: cd sdk && ../sdk-venv/bin/pip install -e ".[dev]"
      - run: python scripts/smoke.py
