# /etc/nginx/nginx.conf for the remote MCP origin host. Replaces the distribution default, whose
# built-in server listens on port 80 (and [::]:80): this host serves NOTHING on 80 and nothing on
# IPv6. The only server blocks are the ones in conf.d/ (nginx-mcp.conf).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    # $uri, not $request: the query string (which may carry OAuth codes/state) is never logged
    access_log /var/log/nginx/access.log main;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/conf.d/*.conf;
}
