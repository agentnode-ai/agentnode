[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "agentnode-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "bcrypt>=4.0,<5",
    "PyJWT>=2.8,<3",
    "pyotp>=2.9,<3",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "PyNaCl>=1.5,<2",
    "cryptography>=42.0",
    "aiosmtplib>=3.0",
    "email-validator>=2.0",
    "anthropic>=0.40",
    "Pillow>=10.0",
    "stripe>=8.0",
]

[project.optional-dependencies]
security = [
    "bandit>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff==0.15.10",
]

[tool.ruff]
# Import-pipeline test fixtures are synthetic test inputs representing arbitrary
# third-party tool code under analysis (intentional unresolved symbols, unused
# imports, etc.), not first-party source. Exclude them from linting and
# formatting entirely; their exact contents are part of the tests.
extend-exclude = [
    "tests/import_real_world/fixtures",
    "tests/import_smoke/fixtures",
]

[tool.ruff.lint]
# Ruff's default rule selection, made explicit so lint results do not drift
# between ruff versions: E4 (imports), E7 (statements), E9 (syntax),
# F (Pyflakes). No additional rules are enabled here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Logging is configured via logging.config.dictConfig() before the app modules
# are imported, so those imports intentionally follow the setup (see main.py
# comment P1-CD11). Reordering would break early logging configuration.
"app/main.py" = ["E402"]
