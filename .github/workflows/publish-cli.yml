name: Publish CLI to npm

# FROZEN: agentnode-cli (npm) is deprecated. Auto-publish on release is
# disabled — this workflow only runs on manual dispatch so a stale, unmaintained
# CLI can't ship new versions. The maintained CLI ships with the Python SDK.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
