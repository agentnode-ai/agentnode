name: Managed access (browser path required)

# The managed-access console is driven by a real browser, and no existing workflow runs that
# path at all: the `dev` extra does not contain Playwright, so under `SDK & Adapter CI` the
# browser suite imports nothing, skips itself, and the lane goes green having tested none of it.
# A suite that reports a working flow when none of it ran is worse than no suite.
#
# So this job installs the browser and runs the managed-access surface with
# AGENTNODE_BROWSER_TESTS=required, which turns "Playwright is missing" from a skip into a
# failure that says so. It then checks the machine-readable report rather than trusting the exit
# code: ZERO skips, no file short of its own count, and no report means no run.
#
# Deliberately NOT touched: sdk-lanes.yml pins `FROZEN_REV` and exercises that commit by design.
# Nothing here changes it. This is a separate file for a path that was never covered.
#
# The action tags below are major tags rather than commit digests. That is what all sixteen other
# workflows in this repository use; pinning one file differently would make this the odd one out
# without making the repository reproducible. It is a known limit, recorded rather than hidden.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # A missing browser is a failure, not a skip. This is the whole point of the job.
  AGENTNODE_BROWSER_TESTS: required
  # Pinned: the version these tests were written and measured against. An unpinned browser means
  # a green run says "it worked against whatever shipped today", which is not a property.
  PLAYWRIGHT_VERSION: "1.62.0"

jobs:
  managed-access:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        # NOTE: this applies to EVERY run step, including the `shell: python` gate below, so
        # paths inside that gate are relative to sdk/ and not to the repository root. An earlier
        # version of this file looked for sdk/report.xml from inside sdk/ and would therefore
        # have failed every single run with "no report was produced".
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the SDK and its dev extra
        run: pip install -e ".[dev]"

      - name: Install the browser these tests drive
        run: |
          pip install "playwright==${PLAYWRIGHT_VERSION}"
          python -m playwright install --with-deps chromium

      - name: Run the managed-access surface
        run: |
          python -m pytest -v -p no:randomly \
            --junit-xml=report.xml \
            tests/test_console_browser.py \
            tests/test_two_accounts_in_a_browser.py \
            tests/test_tenancy_on_every_surface.py \
            tests/test_browser_sessions.py \
            tests/test_one_way_in.py \
            tests/test_routes_register.py \
            tests/test_consent_and_tools.py \
            tests/test_approval_targets.py \
            tests/test_compatibility_challenge.py \
            tests/test_compatibility.py \
            tests/test_credentials.py \
            tests/test_stopping.py \
            tests/test_cancel_is_not_a_wait.py \
            tests/test_dispatch.py \
            tests/test_contract_and_schemas.py \
            tests/test_end_to_end_rest.py \
            tests/test_every_door.py \
            tests/test_lifecycle_release.py \
            tests/test_lifecycle_deadlock.py \
            tests/test_serving_ownership.py

      - name: A skip is not a pass, and neither is a file that quietly shrank
        if: always()
        shell: python
        run: |
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          # What each file collects today. PER FILE rather than one total, because a total can
          # acquire slack: add twenty tests here, lose a class of twenty there, and an aggregate
          # floor still passes while a whole property has stopped being checked.
          FLOOR = {
              "test_console_browser": 30, "test_browser_sessions": 30, "test_one_way_in": 47,
              # Two customers in two real browsers, and the same refusals asked through the SDK,
              # the command line, the local bridge and the older doors. The browser one belongs
              # in THIS lane for the reason at the top of this file: without Playwright it would
              # skip, and a skip that reads as a pass is how a suite comes to report an isolation
              # property that nothing checked.
              "test_two_accounts_in_a_browser": 17, "test_tenancy_on_every_surface": 44,
              # Four more: the console keeps its own table of which operations travel as POST,
              # and it had drifted from the contract, so "Weiteres Gerät hinzufügen" sent a GET
              # and every customer adding a second machine met a refusal.
              "test_routes_register": 38, "test_consent_and_tools": 55,
              "test_approval_targets": 13, "test_compatibility_challenge": 24,
              "test_compatibility": 26, "test_credentials": 13, "test_stopping": 34,
              "test_cancel_is_not_a_wait": 9, "test_dispatch": 24,
              "test_contract_and_schemas": 19, "test_end_to_end_rest": 9, "test_every_door": 14,
              # The three that state the resource properties: descriptors given back, every
              # ending leaving the same nothing, and repeated cycles not growing.
              "test_lifecycle_release": 15, "test_lifecycle_deadlock": 6,
              "test_serving_ownership": 5,
          }

          # Relative to sdk/, which is this step's working directory. See the note above.
          report = pathlib.Path("report.xml")
          if not report.exists():
              print("::error::no report at %s (cwd %s), so NO TEST RAN -- that is not a pass"
                    % (report, os.getcwd()))
              sys.exit(1)

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)

          def which_file(case):
              """The module a case belongs to, from whichever field this pytest wrote."""
              named = case.get("file") or ""
              if named.endswith(".py"):
                  return os.path.basename(named)[:-3]
              parts = (case.get("classname") or "").split(".")
              if len(parts) >= 2 and parts[0] == "tests":
                  return parts[1]
              return parts[0] if parts else ""

          ran = {}
          for suite in suites:
              for case in suite.iter("testcase"):
                  name = which_file(case)
                  if name:
                      ran[name] = ran.get(name, 0) + 1

          print("tests=%d skipped=%d failures=%d errors=%d" % (total, skipped, failures, errors))
          for name in sorted(FLOOR):
              print("  %-32s %3d / %3d" % (name, ran.get(name, 0), FLOOR[name]))

          bad = []
          if skipped:
              names = [c.get("name") for s in suites for c in s.iter("testcase")
                       if c.find("skipped") is not None]
              bad.append("%d test(s) were SKIPPED and a skip does not count as green: %s"
                         % (skipped, ", ".join(names[:10])))
          if failures or errors:
              bad.append("%d failure(s) and %d error(s)" % (failures, errors))
          short = ["%s ran %d of %d" % (n, ran.get(n, 0), FLOOR[n])
                   for n in sorted(FLOOR) if ran.get(n, 0) < FLOOR[n]]
          if short:
              bad.append("these files ran fewer tests than they collect -- something was lost: "
                         + "; ".join(short))

          for line in bad:
              print("::error::" + line)
          sys.exit(1 if bad else 0)

      - name: Keep the report whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # NOT relative to the working-directory above: `uses` steps resolve against the
          # workspace root, and only `run` steps take the default.
          name: managed-access-report-${{ matrix.python-version }}
          path: sdk/report.xml
          if-no-files-found: error
