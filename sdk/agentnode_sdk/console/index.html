<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>AgentNode — Einrichtung</title>
<style>
:root{
  --paper:#FCFCFD; --raise:#FFFFFF; --ink:#191B21; --muted:#5D626F; --faint:#888E9D;
  --line:#E4E6EE; --line-strong:#CBCFDC;
  --accent:#2B4FD8; --accent-ink:#FFFFFF; --accent-soft:#EDF0FE;
  --good:#0B6E51; --good-soft:#E6F4EF;
  --warn:#8A5A00; --warn-soft:#FBF1DE;
  --bad:#A62B34; --bad-soft:#FBECED;
  --shadow:0 1px 2px rgba(20,22,30,.05), 0 8px 24px -12px rgba(20,22,30,.18);
  --radius:12px;
  --step:clamp(1rem, .9rem + .4vw, 1.0625rem);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101218; --raise:#171A22; --ink:#EDEEF3; --muted:#A3A9B8; --faint:#7C8394;
    --line:#262A35; --line-strong:#39404F;
    --accent:#7D95F5; --accent-ink:#101218; --accent-soft:#1B2140;
    --good:#5FC9A5; --good-soft:#12302A;
    --warn:#E0B267; --warn-soft:#332815;
    --bad:#F0868F; --bad-soft:#3A1D20;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#101218; --raise:#171A22; --ink:#EDEEF3; --muted:#A3A9B8; --faint:#7C8394;
  --line:#262A35; --line-strong:#39404F;
  --accent:#7D95F5; --accent-ink:#101218; --accent-soft:#1B2140;
  --good:#5FC9A5; --good-soft:#12302A;
  --warn:#E0B267; --warn-soft:#332815;
  --bad:#F0868F; --bad-soft:#3A1D20;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:var(--step)/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100dvh;
}
.wrap{max-width:44rem;margin:0 auto;padding:clamp(1rem,3vw,2.5rem) clamp(1rem,4vw,1.5rem) 5rem}
.wide{max-width:60rem}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(1.45rem,1.2rem+1.4vw,2rem);letter-spacing:-.015em}
h2{font-size:clamp(1.15rem,1.05rem+.6vw,1.4rem);letter-spacing:-.01em}
h3{font-size:1rem;letter-spacing:-.005em}
p{margin:.65em 0}
.lede{color:var(--muted);font-size:1.02em}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:.9em}

header.bar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.bar-in{max-width:60rem;margin:0 auto;padding:.6rem clamp(1rem,4vw,1.5rem);
  display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.mark{font-weight:650;letter-spacing:-.02em;display:flex;gap:.5rem;align-items:center}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);flex:none}
nav.tabs{display:flex;gap:.15rem;margin-left:auto;flex-wrap:wrap}
nav.tabs button{
  font:inherit;font-size:.92rem;background:none;border:0;color:var(--muted);
  padding:.4rem .6rem;border-radius:8px;cursor:pointer;
}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--ink)}

.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(1.1rem,3vw,1.6rem);box-shadow:var(--shadow)}
.card + .card{margin-top:1rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:.75rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}

.steps{display:flex;align-items:center;gap:.4rem;margin:0 0 1.25rem;padding:0;list-style:none;flex-wrap:wrap}
.steps li{width:.5rem;height:.5rem;border-radius:50%;background:var(--line-strong)}
.steps li.done{background:var(--accent)}
.steps li.now{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepno{font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}

button.b, a.b{
  font:inherit;font-weight:600;border-radius:10px;padding:.65rem 1.05rem;border:1px solid transparent;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem;
  transition:background .12s ease,border-color .12s ease,opacity .12s ease;
}
button.b:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,black)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.ghost:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.quiet{background:transparent;color:var(--muted);border-color:transparent;padding:.5rem .6rem}
.quiet:hover:not(:disabled){color:var(--ink);background:var(--accent-soft)}
.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.danger:hover:not(:disabled){background:var(--bad-soft)}
:where(button,a,input,select,summary,[tabindex]):focus-visible{
  outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

label.f{display:block;font-weight:600;margin-bottom:.3rem}
input[type=text]{
  font:inherit;width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--paper);color:var(--ink)}
input[type=text]:focus{border-color:var(--accent)}
.code-in{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;font-size:1.15rem}

.note{border-radius:10px;padding:.8rem .9rem;border:1px solid;font-size:.96em}
.note h3{font-size:.96rem;margin-bottom:.2rem}
.n-good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent);color:var(--good)}
.n-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.n-bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}
.n-plain{background:transparent;border-color:var(--line);color:var(--muted)}
.note p{margin:.3em 0;color:inherit}
.note .b{margin-top:.5rem}

.pick{display:grid;gap:.6rem}
.pick button{
  text-align:left;font:inherit;background:var(--paper);border:1px solid var(--line-strong);
  border-radius:10px;padding:.85rem 1rem;cursor:pointer;color:var(--ink);display:grid;gap:.15rem}
.pick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick b{font-weight:650}
.pick span{color:var(--muted);font-size:.93em}
.pick button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}

.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:650;
  padding:.2rem .55rem;border-radius:999px;border:1px solid}
.p-run{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.p-good{color:var(--good);background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.p-warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.p-bad{color:var(--bad);background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:.8rem 0;border-top:1px solid var(--line);display:flex;gap:.75rem;
  align-items:center;justify-content:space-between;flex-wrap:wrap}
.list li:first-child{border-top:0}
.list .who{display:grid;gap:.1rem;min-width:11rem}
.list .who b{font-weight:600}

.meter{height:.5rem;border-radius:999px;background:var(--line);overflow:hidden;margin:.45rem 0 .3rem}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter i.hot{background:var(--warn)}
.meter i.over{background:var(--bad)}
.nums{font-variant-numeric:tabular-nums}

pre.out{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.8rem;
  overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;
  margin:.5rem 0 0;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;color:var(--muted);font-size:.92em;padding:.3rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spin{display:inline-block;width:.85em;height:.85em;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.1em}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}*{transition:none!important}}
footer.foot{max-width:60rem;margin:2.5rem auto 0;padding:0 clamp(1rem,4vw,1.5rem);color:var(--faint);font-size:.86rem}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="mark"><span class="dot"></span>AgentNode</span>
    <nav class="tabs" id="tabs" hidden aria-label="Bereiche"></nav>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1"></main>
<footer class="foot" id="foot"></footer>

<script>
"use strict";
/* ---------------------------------------------------------------------------
 * Everything below talks to the same addresses any other client talks to, with
 * the same credential, through the same dispatcher. The browser is not a
 * privileged client; there is no route here that anything else cannot call.
 * ------------------------------------------------------------------------- */

var S = {                       // what this window knows. Nothing is written to disk.
  token: null, device: null, gateway: null, caps: null,
  way: null, tab: "setup", step: 0, jobs: [], busy: false, err: null
};

/* The credential lives in sessionStorage and nowhere else: not in the address
 * bar, not in a cookie that would ride along on every request, and not in
 * localStorage where it would outlive the window somebody walked away from. */
var KEEP = "agentnode.session";
function remember(){ try{ sessionStorage.setItem(KEEP, JSON.stringify(
  {token:S.token, device:S.device, gateway:S.gateway})); }catch(e){} }
function recall(){
  try{ var k = JSON.parse(sessionStorage.getItem(KEEP)||"null");
    if(k && k.token){ S.token=k.token; S.device=k.device; S.gateway=k.gateway; return true; }
  }catch(e){}
  return false;
}
function forget(){ try{ sessionStorage.removeItem(KEEP); }catch(e){} S.token=null; S.device=null; }

/* --- talking to the sandbox ---------------------------------------------- */

var NEEDS_POST = {prepare:1, submit:1, status:1, result:1, cancel:1, usage:1, "devices.revoke":1};

function call(op, params){
  var post = !!NEEDS_POST[op];
  var init = {method: post ? "POST" : "GET", headers: {}, cache: "no-store",
              credentials: "omit", referrerPolicy: "no-referrer"};
  if(S.token) init.headers["X-AgentNode-Token"] = S.token;
  if(post){ init.headers["Content-Type"] = "application/json";
            init.body = JSON.stringify(params||{}); }
  // `devices.list` is reached at `/v1/op/devices/list`. Sending the dot got a 404 and the page
  // showed "Etwas hat nicht funktioniert" on the devices screen -- found by the browser test,
  // which is exactly the kind of thing only clicking through it finds.
  return fetch("/v1/op/" + op.replace(/\./g, "/"), init).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(body){
      if(body && body.refused) throw refusal(body);
      if(!r.ok) throw plain("Die Sandbox hat nicht geantwortet, wie sie sollte.");
      return body;
    });
  }, function(){ throw plain("Die Sandbox ist gerade nicht erreichbar."); });
}

function refusal(body){
  var e = new Error(body.because || "abgelehnt");
  e.refused = body.refused; e.because = body.because; e.what_to_do = body.what_to_do;
  return e;
}
function plain(msg){ var e = new Error(msg); e.refused = "unreachable"; return e; }

/* What a person is told when something is refused, and what they can do about
 * it. Never the server's own sentence: those name commands to run on the host,
 * which is the one thing somebody using this page cannot do. */
var SAYS = {
  // One message for all of it, because the sandbox really cannot tell these apart -- it keeps
  // no record of a credential once it is withdrawn. Naming only one of the causes would be a
  // guess presented as a fact, so the wording covers every case truthfully and the action is
  // the same in all of them.
  not_authenticated: ["Dieser Zugang gilt nicht mehr.",
    "Das passiert, wenn ein Zugang zurückgezogen wurde, abgelaufen ist oder nie gültig war. " +
    "Mit einem neuen Einladungslink können Sie sich wieder verbinden.", "again"],
  not_permitted: ["Dieses Gerät darf das nicht.",
    "Bitte bei der Person nachfragen, die die Sandbox betreibt.", ""],
  gateway_stopped: ["Die Sandbox nimmt gerade keine Arbeit an.",
    "Der Betrieb wurde angehalten. Sobald er wieder läuft, funktioniert alles Weitere unverändert.", "retry"],
  over_a_ceiling: ["Das Kontingent für dieses Zeitfenster ist aufgebraucht.",
    "Laufende Aufträge sind nicht betroffen. Sobald das Fenster weiterrückt, geht es wieder.", "usage"],
  refused_by_policy: ["Das ist hier nicht erlaubt.",
    "Die Sandbox lässt diesen Auftrag nicht zu. Ein einfacherer Auftrag ohne Netzzugriff geht meist.", ""],
  sandbox_unavailable: ["Die Sandbox selbst läuft gerade nicht.",
    "Ohne sie wird nichts ausgeführt — das ist so gewollt. Bitte später noch einmal versuchen.", "retry"],
  no_such_run: ["Diesen Auftrag gibt es nicht (mehr).", "Bitte die Übersicht neu laden.", "retry"],
  not_finished: ["Der Auftrag läuft noch.", "Das Ergebnis erscheint, sobald er fertig ist.", ""],
  malformed: ["Diese Anfrage war nicht in Ordnung.", "Bitte die Seite neu laden.", "retry"],
  unreachable: ["Keine Verbindung zur Sandbox.",
    "Prüfen, ob der Rechner läuft, auf dem die Sandbox betrieben wird.", "retry"]
};
function explain(e){
  var k = SAYS[e && e.refused];
  if(k) return {title:k[0], help:k[1], fix:k[2]};
  return {title:"Etwas hat nicht funktioniert.",
          help:(e && e.message) || "Bitte noch einmal versuchen.", fix:"retry"};
}

/* --- little helpers ------------------------------------------------------- */

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  for(var k in (attrs||{})){
    var v = attrs[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === "text") n.textContent = v;
    else if(k === "html") n.innerHTML = v;
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
    else if(v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function hex(n){
  var a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.prototype.map.call(a, function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
}
function digest(text){
  var bytes = new TextEncoder().encode(text);
  return crypto.subtle.digest("SHA-256", bytes).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),
      function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
  });
}
function b64(text){
  var bytes = new TextEncoder().encode(text), s = "";
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function ago(ts){
  if(!ts) return "noch nie benutzt";
  var s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if(s < 60) return "gerade eben";
  if(s < 3600) return "vor " + Math.floor(s/60) + " Min.";
  if(s < 86400) return "vor " + Math.floor(s/3600) + " Std.";
  return "vor " + Math.floor(s/86400) + " Tagen";
}
function guessDeviceName(){
  var ua = navigator.userAgent || "";
  if(/iPhone/.test(ua)) return "Mein iPhone";
  if(/iPad/.test(ua)) return "Mein iPad";
  if(/Android/.test(ua)) return "Mein Android-Telefon";
  if(/Macintosh/.test(ua)) return "Mein Mac";
  if(/Windows/.test(ua)) return "Mein Windows-PC";
  if(/Linux/.test(ua)) return "Mein Linux-Rechner";
  return "Mein Gerät";
}

/* --- the ten steps -------------------------------------------------------- */

var STEPS = [
  "Einrichten", "Einladung", "Gerät benennen", "Verbindung bestätigen", "KI auswählen",
  "Einrichtung", "Test", "Bestätigung", "Erster Auftrag", "Ergebnis"
];

/* The connection assistant's catalogue. Which of these are OFFERED is decided by
 * what this gateway actually reports it can do -- see waysIn(). */
var WAYS = [
  {id:"bridge", label:"Claude Code oder Codex auf meinem Rechner",
   hint:"Werkzeuge über eine lokale Brücke — die verbreitetste Variante.",
   needs:"mcp", how:"Einrichtungsdatei"},
  {id:"mcp", label:"Ein anderes Programm, das Werkzeuge anbinden kann",
   hint:"Alles, was Werkzeuge über MCP anspricht, verbindet sich direkt.",
   needs:"mcp", how:"Verbinden"},
  {id:"rest", label:"Eigene Software oder ein eigenes Skript",
   hint:"Spricht die Sandbox über ihre normale Schnittstelle an.",
   needs:"rest", how:"Einrichtungsdatei"},
  {id:"cli", label:"Die Kommandozeile auf meinem Rechner",
   hint:"Für Leute, die ohnehin im Terminal arbeiten.",
   needs:"rest", how:"Einrichtungsdatei"},
  {id:"none", label:"Ein reines Chatfenster ohne Werkzeuge",
   hint:"Eine KI, die nichts außerhalb ihres Chats aufrufen kann.",
   needs:"nothing", how:"—"}
];

/* --- rendering ------------------------------------------------------------ */

function show(nodes){
  var m = document.getElementById("main");
  m.innerHTML = "";
  (Array.isArray(nodes)?nodes:[nodes]).forEach(function(n){ if(n) m.appendChild(n); });
  drawTabs(); drawFoot();
}
function drawTabs(){
  var nav = document.getElementById("tabs");
  nav.innerHTML = "";
  if(!S.token){ nav.hidden = true; return; }
  nav.hidden = false;
  [["setup","Übersicht"],["devices","Geräte"],["usage","Verbrauch"],["safety","Sicherheit"]]
    .forEach(function(t){
      nav.appendChild(el("button", {text:t[1], type:"button",
        "aria-current": S.tab === t[0] ? "page" : null,
        onclick: function(){ S.tab = t[0]; render(); }}));
    });
}
function drawFoot(){
  var f = document.getElementById("foot");
  f.innerHTML = "";
  var limits = (S.caps && S.caps.what_this_does_not_establish) || [];
  if(!limits.length) return;
  f.appendChild(el("p", {text:"Was diese Sandbox ausdrücklich nicht ist:"}));
  var ul = el("ul", {});
  limits.forEach(function(l){ ul.appendChild(el("li", {text: l})); });
  f.appendChild(ul);
}
function progress(){
  var ul = el("ul", {"class":"steps", "aria-label":"Fortschritt: Schritt " + (S.step+1) + " von 10"});
  for(var i=0;i<STEPS.length;i++)
    ul.appendChild(el("li", {"class": i < S.step ? "done" : (i === S.step ? "now" : "")}));
  return ul;
}
function head(title, lede){
  return el("div", {}, [
    progress(),
    el("p", {"class":"stepno", text:"Schritt " + (S.step+1) + " von 10 · " + STEPS[S.step]}),
    el("h1", {text:title}),
    lede ? el("p", {"class":"lede", text:lede}) : null
  ]);
}
function problem(e, retry){
  var w = explain(e);
  var box = el("div", {"class":"note n-bad", role:"alert"}, [
    el("h3", {text:w.title}), el("p", {text:w.help})
  ]);
  if(w.fix === "retry" && retry)
    box.appendChild(el("button", {"class":"b ghost", type:"button", text:"Noch einmal versuchen",
      onclick:retry}));
  if(w.fix === "again")
    box.appendChild(el("button", {"class":"b ghost", type:"button", text:"Einrichtung neu starten",
      onclick:function(){ forget(); S.step=0; S.err=null; render(); }}));
  if(w.fix === "usage")
    box.appendChild(el("button", {"class":"b ghost", type:"button", text:"Verbrauch ansehen",
      onclick:function(){ S.tab="usage"; S.err=null; render(); }}));
  return box;
}

/* --- step 1: willkommen --------------------------------------------------- */

function stepWelcome(){
  show([
    head("Willkommen bei AgentNode.",
         "In zehn kurzen Schritten verbinden wir dieses Gerät mit einer Sandbox — " +
         "einem abgeschirmten Platz, an dem eine KI Code ausführen kann, ohne an Ihren " +
         "Rechner zu kommen."),
    el("div", {"class":"card stack"}, [
      el("h2", {text:"Was Sie dafür brauchen"}),
      el("ul", {}, [
        el("li", {text:"Einen Einladungslink oder einen kurzen Einladungscode."}),
        el("li", {text:"Ein paar Minuten. Nichts davon wird auf diesem Gerät gespeichert."})
      ]),
      el("div", {"class":"row"}, [
        el("button", {"class":"b primary", type:"button", id:"start", text:"Einrichtung starten",
          onclick:function(){ S.step=1; render(); }})
      ])
    ])
  ]);
}

/* --- step 2: einladung ---------------------------------------------------- */

/* An invitation arrives as `…/console#code=XXXX-XXXX`. The part after the # is
 * never sent to a server, never lands in an access log, and is not passed on in
 * a Referer header. It is read once, used once, and wiped out of the address bar
 * before anything else happens -- so a screenshot or a shared link carries nothing.
 */
function codeFromLink(){
  var frag = (location.hash || "").replace(/^#/, "");
  if(!frag) return "";
  var found = "";
  frag.split("&").forEach(function(part){
    var bits = part.split("=");
    if(bits[0] === "code" || bits[0] === "einladung") found = decodeURIComponent(bits.slice(1).join("="));
  });
  if(found){
    history.replaceState(null, "", location.pathname + location.search);
  }
  return found;
}

function stepInvitation(prefill){
  var code = prefill !== undefined ? prefill : codeFromLink();
  var invited = !!code;
  var input = el("input", {type:"text", id:"code", "class":"code-in", value:code,
    autocomplete:"one-time-code", inputmode:"latin", spellcheck:"false",
    "aria-describedby":"code-help", placeholder:"z. B. 7K4M-2QPD"});

  function go(){
    var typed = (input.value||"").trim();
    if(!typed){ S.err = plain("Bitte den Einladungscode eingeben."); return render(); }
    S.busy = true; S.err = null; render();
    S.pendingCode = typed;
    S.step = 2; S.busy = false; render();
  }

  var form = el("form", {onsubmit:function(ev){ ev.preventDefault(); go(); }}, [
    el("label", {"class":"f", "for":"code", text:"Einladungscode"}),
    input,
    el("p", {"class":"faint", id:"code-help",
      text:"Der Code gilt einmalig und läuft nach kurzer Zeit ab."}),
    el("div", {"class":"row"}, [
      el("button", {"class":"b primary", type:"submit", text:"Weiter"}),
      el("button", {"class":"b quiet", type:"button", text:"Zurück",
        onclick:function(){ S.step=0; S.err=null; render(); }})
    ])
  ]);

  show([
    head(invited ? "Ihre Einladung ist da." : "Einladung eingeben.",
         invited ? "Wir haben den Code aus Ihrem Link übernommen. Er steht nicht mehr in der " +
                   "Adresszeile, damit er beim Weitergeben des Links nicht mitwandert."
                 : "Geben Sie den Code ein, den Sie bekommen haben."),
    el("div", {"class":"card stack"}, [
      S.err ? problem(S.err, function(){ S.err=null; render(); }) : null,
      form
    ])
  ]);
  if(!invited) input.focus();
}

/* --- step 3: gerät benennen ----------------------------------------------- */

function stepName(){
  var input = el("input", {type:"text", id:"devname", value: S.deviceName || guessDeviceName(),
    autocomplete:"off", maxlength:"60"});

  function go(){
    var name = (input.value||"").trim() || guessDeviceName();
    S.deviceName = name;
    S.busy = true; S.err = null; render();
    fetch("/v1/pair", {method:"POST", headers:{"Content-Type":"application/json"},
      cache:"no-store", credentials:"omit", referrerPolicy:"no-referrer",
      body: JSON.stringify({code: S.pendingCode, client_name: name})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(body){
        if(!r.ok || !body.token) throw pairingProblem(body);
        return body;
      });
    }, function(){ throw plain("Die Sandbox ist gerade nicht erreichbar."); })
    .then(function(body){
      S.pendingCode = null;                 // used once, and gone from this window too
      S.token = body.token;
      S.gateway = (body.gateway && body.gateway.gateway_id) || "";
      S.device = name;
      remember();
      return call("capabilities");
    }).then(function(caps){
      S.caps = caps; S.busy = false; S.step = 3; render();
    }).catch(function(e){
      S.busy = false; S.err = e;
      S.step = e.backToCode ? 1 : 2;
      render();
    });
  }

  show([
    head("Wie soll dieses Gerät heißen?",
         "Der Name taucht später in Ihrer Geräteliste auf. So erkennen Sie, was Sie zurückziehen, " +
         "wenn Sie ein Gerät verlieren."),
    el("div", {"class":"card stack"}, [
      S.err ? problem(S.err, null) : null,
      el("form", {onsubmit:function(ev){ ev.preventDefault(); go(); }}, [
        el("label", {"class":"f", "for":"devname", text:"Gerätename"}),
        input,
        el("p", {"class":"faint", text:"Vorschlag schon eingetragen — Sie können ihn einfach übernehmen."}),
        el("div", {"class":"row"}, [
          el("button", {"class":"b primary", type:"submit", id:"confirm-name",
            text: S.busy ? "Wird verbunden…" : "Verbinden", disabled: S.busy || undefined}),
          el("button", {"class":"b quiet", type:"button", text:"Zurück",
            onclick:function(){ S.step=1; S.err=null; render(); }})
        ])
      ])
    ])
  ]);
}

/* The pairing route answers with the operator's own sentence, which names
 * commands to run on the server. Somebody using this page cannot run those, so
 * the sentence is translated into something they CAN act on. The three cases a
 * person actually hits are told apart; anything else is reported honestly rather
 * than guessed at. */
function pairingProblem(body){
  var said = String((body && body.error) || "");
  var e;
  if(/expired/i.test(said)){
    e = plain("Diese Einladung ist abgelaufen.");
    e.refused = "invitation_expired";
  } else if(/a pairing code is|characters/i.test(said)){
    e = plain("Dieser Code ist nicht vollständig.");
    e.refused = "invitation_short";
  } else if(/does not match|not a valid|invalid/i.test(said)){
    e = plain("Dieser Code stimmt nicht.");
    e.refused = "invitation_wrong";
  } else if(/not accepting pairings/i.test(said)){
    e = plain("Diese Einladung wurde schon benutzt.");
    e.refused = "invitation_used";
  } else if(/too many|throttl/i.test(said)){
    e = plain("Zu viele Versuche.");
    e.refused = "invitation_throttled";
  } else {
    e = plain("Die Einladung konnte nicht eingelöst werden.");
    e.refused = "invitation_other";
  }
  e.backToCode = true;
  return e;
}
SAYS.invitation_expired = ["Diese Einladung ist abgelaufen.",
  "Einladungen gelten absichtlich nur kurz. Bitte eine neue anfordern und den neuen Link öffnen.", ""];
SAYS.invitation_wrong = ["Dieser Code stimmt nicht.",
  "Bitte Zeichen für Zeichen vergleichen — Groß- und Kleinschreibung spielt keine Rolle.", ""];
SAYS.invitation_used = ["Diese Einladung wurde schon benutzt.",
  "Jede Einladung funktioniert genau einmal. Bitte eine neue anfordern.", ""];
SAYS.invitation_short = ["Dieser Code ist nicht vollständig.",
  "Ein Einladungscode hat zwölf Zeichen in drei Vierergruppen, zum Beispiel ABCD-EFGH-JKLM. " +
  "Am besten den ganzen Code noch einmal einfügen.", ""];
SAYS.invitation_throttled = ["Zu viele Versuche.",
  "Bitte einen Moment warten und es dann mit dem richtigen Code noch einmal versuchen.", ""];
SAYS.invitation_other = ["Die Einladung konnte nicht eingelöst werden.",
  "Bitte eine neue Einladung anfordern.", ""];

/* --- step 4: verbindung und schutz bestätigen ----------------------------- */

function stepConfirm(){

/* --- step 5: KI auswählen (capability discovery) --------------------------- */

/* What is offered comes from what the gateway says about ITSELF: the operations
 * it publishes and the doors it answers on. Nothing here is a hard-coded claim
 * that a given product works -- the page only offers what this sandbox can
 * actually be reached through. */
function waysIn(){
  var ops = ((S.caps && S.caps.operations) || []).map(function(o){ return o.name; });
  var canRun = ops.indexOf("submit") >= 0;
  return WAYS.filter(function(w){
    if(w.needs === "nothing") return true;
    return canRun;
  });
}

function stepChoose(){
  var options = waysIn();
  var picks = el("div", {"class":"pick"});
  options.forEach(function(w){
    picks.appendChild(el("button", {type:"button", id:"way-"+w.id,
      "aria-pressed": S.way === w.id ? "true" : "false",
      onclick:function(){ S.way = w.id; render(); }}, [
        el("b", {text:w.label}), el("span", {text:w.hint})
      ]));
  });

  var after = null;
  if(S.way === "none"){
    after = el("div", {"class":"note n-bad", id:"not-compatible", role:"note"}, [
      el("h3", {text:"Diese KI kann AgentNode nicht direkt verwenden, weil sie keine externen " +
                     "Werkzeuge aufrufen kann."}),
      el("p", {text:"Das ist keine Einstellungssache und lässt sich hier nicht umgehen: Was " +
                    "nichts außerhalb des Chats aufrufen kann, kann auch keine Sandbox benutzen."}),

  show([

/* --- step 6: einrichtung -------------------------------------------------- */

/* The setup file is generated, offered whole, and never something to hand-edit.
 * It is not shown by default either: it carries the device credential, and a
 * credential on screen is a credential in the next screenshot. */
function setupFile(){
  var origin = location.origin;
  if(S.way === "rest" || S.way === "cli"){
    return {name:"agentnode-verbindung.txt",
      body:"# AgentNode — Verbindung für dieses Gerät\n" +
           "# Diese Datei enthält einen Zugang. Nicht weitergeben.\n" +
           "AGENTNODE_URL=" + origin + "\n" +
           "AGENTNODE_TOKEN=" + S.token + "\n"};
  }
  return {name:"agentnode-werkzeuge.json",
    body: JSON.stringify({mcpServers:{agentnode:{
      url: origin + "/v1/mcp",
      headers: {"X-AgentNode-Token": S.token}}}}, null, 2) + "\n"};
}

function stepSetup(){
  var file = setupFile();
  var copied = el("span", {"class":"faint", id:"copy-said", text:""});

  function copy(){
    var done = function(){ copied.textContent = "In die Zwischenablage kopiert."; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(file.body).then(done, fallback);
    } else fallback();
    function fallback(){
      var ta = el("textarea", {}); ta.value = file.body;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }
      catch(e){ copied.textContent = "Kopieren ging nicht — bitte herunterladen."; }
      document.body.removeChild(ta);
    }
  }
  function download(){
    var blob = new Blob([file.body], {type:"text/plain"});
    var a = el("a", {href: URL.createObjectURL(blob), download: file.name});
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }

  show([
    head("Ihre Einrichtung ist fertig.",
         "Sie müssen nichts selbst zusammenstellen und nichts von Hand ändern."),
    el("div", {"class":"card stack"}, [
      el("p", {text:"Übernehmen Sie diese eine Datei in Ihr Programm. Mehr ist nicht nötig."}),
      el("div", {"class":"row"}, [
        el("button", {"class":"b primary", type:"button", id:"copy-setup",
          text:"Einrichtung kopieren", onclick:copy}),
        el("button", {"class":"b ghost", type:"button", id:"download-setup",
          text:"Als Datei speichern", onclick:download})
      ]),
      copied,
      el("div", {"class":"note n-warn"}, [
        el("p", {text:"Die Datei enthält Ihren Zugang. Behandeln Sie sie wie ein Passwort — " +
                      "nicht in einen Chat einfügen, nicht in ein geteiltes Verzeichnis legen."})
      ]),
      el("details", {}, [
        el("summary", {text:"Ich weiß, was ich tue — Inhalt anzeigen"}),
        el("pre", {"class":"out", id:"setup-body", text:file.body})
      ]),
      el("div", {"class":"row"}, [
        el("button", {"class":"b primary", type:"button", id:"setup-next",
          text:"Übernommen — jetzt testen", onclick:function(){ S.step=6; render(); }}),
        el("button", {"class":"b quiet", type:"button", text:"Zurück",
          onclick:function(){ S.step=4; render(); }})
      ])
    ])
  ]);
}

/* --- step 7: testaufruf --------------------------------------------------- */

/* Compatibility is decided by an OBSERVED call, never by this page asserting it.
 * For a program of your own, that means waiting until the sandbox itself has
 * recorded a job started by something that is not this page -- the usage counter
 * only moves when work is actually submitted, and this page submits nothing
 * while it is waiting. */
function stepTest(){
  var box = el("div", {"class":"stack", id:"test-area"});

  function testFromHere(){
    box.innerHTML = "";
    box.appendChild(el("p", {}, [el("span", {"class":"spin"}), document.createTextNode(" Testet…")]));
    runJob("print('AgentNode: Test bestanden')", "Testaufruf").then(function(job){
      S.lastTest = job;
      // The test screen is the one place that should wait: "the connection works" must not be
      // said on the strength of a job that was merely accepted.
      return untilOver(job).then(function(){ S.step = 7; render(); });
    }).catch(function(e){ S.err = e; box.innerHTML=""; box.appendChild(problem(e, testFromHere)); });
  }

  function waitForTheirCall(){
    box.innerHTML = "";
    var line = el("p", {}, [el("span", {"class":"spin"}),
      document.createTextNode(" Wartet auf den ersten Aufruf aus Ihrem Programm…")]);
    box.appendChild(line);
    box.appendChild(el("button", {"class":"b quiet", type:"button", id:"test-here-instead",
      text:"Stattdessen von hier aus testen", onclick:testFromHere}));
    call("usage", {}).then(function(before){
      var started = before.runs || 0, tries = 0;
      (function look(){
        if(++tries > 150){
          S.err = plain("Es kam kein Aufruf an.");
          S.err.refused = "no_call_arrived";
          box.innerHTML = ""; box.appendChild(problem(S.err, waitForTheirCall));
          box.appendChild(el("button", {"class":"b ghost", type:"button", id:"test-here-instead-2",
            text:"Von hier aus testen", onclick:testFromHere}));
          return;
        }
        call("usage", {}).then(function(now){
          if((now.runs||0) > started){ S.observedFrom = "ihr Programm"; S.step = 7; render(); }
          else setTimeout(look, 2000);
        }).catch(function(e){ box.innerHTML=""; box.appendChild(problem(e, waitForTheirCall)); });
      })();
    }).catch(function(e){ box.innerHTML=""; box.appendChild(problem(e, waitForTheirCall)); });
  }

  var theirs = (S.way === "bridge" || S.way === "mcp" || S.way === "rest" || S.way === "cli");
  show([
    head("Jetzt prüfen wir, ob es wirklich funktioniert.",
         theirs ? "Lassen Sie Ihr Programm einmal etwas in der Sandbox tun. Wir sagen Bescheid, " +
                  "sobald der Aufruf hier angekommen ist."
                : "Wir führen einen echten Aufruf aus — kein Probelauf, sondern dieselbe " +
                  "Verbindung, die Sie später benutzen."),
    el("div", {"class":"card stack"}, [
      box,
      el("p", {"class":"faint", text:"Als funktionierend gilt die Verbindung erst, wenn die " +
        "Sandbox einen Aufruf tatsächlich verzeichnet hat. Vorher behaupten wir nichts."})
    ])
  ]);
  if(theirs) waitForTheirCall(); else testFromHere();
}
SAYS.no_call_arrived = ["Es kam kein Aufruf an.",
  "Meist ist die Einrichtungsdatei noch nicht übernommen oder das Programm wurde noch nicht " +
  "neu gestartet. Beides kurz prüfen und es noch einmal versuchen.", ""];

/* --- step 9 + 10: erster auftrag, ergebnis -------------------------------- */

/* Resolves once the sandbox has ACCEPTED the job, not once the job is done.
 *
 * The first version waited for the whole run before it let the page move on, which meant somebody
 * starting their first job sat on a screen with nothing happening and then jumped straight to a
 * finished result -- never seeing it run, never able to cancel it. Watching carries on in the
 * background and repaints as the state changes. */
function runJob(code, label){
  var run_id = hex(16);
  return digest(code).then(function(sha){
    return call("prepare", {command:["python","-c",code], artifact_sha256:sha,
                            artifact_bytes: new TextEncoder().encode(code).length,
                            wall_clock_s: 30});
  }).then(function(told){
    return call("submit", {run_id: run_id, artifact: b64(code),
                           command:["python","-c",code], wall_clock_s: 30,
                           accepted_disclosure: told.accepted_disclosure});
  }).then(function(started){
    var job = {run_id: started.run_id, label: label || "Auftrag", state: started.state};
    S.jobs.unshift(job);
    watch(job);
    return job;
  });
}

function untilOver(job){
  return new Promise(function(done){
    (function look(){
      if(["finished","refused","cancelled","unverified","interrupted"].indexOf(job.state) >= 0)
        return done(job);
      setTimeout(look, 300);
    })();
  });
}

function watch(job){
  var tries = 0;
  return new Promise(function(done){
    (function look(){
      call("status", {run_id: job.run_id}).then(function(where){
        job.state = where.state;
        if(S.tab === "setup") paintJobs();
        var over = ["finished","refused","cancelled","unverified","interrupted"].indexOf(where.state) >= 0;
        if(over) return call("result", {run_id: job.run_id}).then(function(out){
          job.out = out; paintJobs(); done();
        }, function(){ paintJobs(); done(); });
        if(++tries > 300) return done();
        setTimeout(look, 1000);
      }, function(){ if(++tries > 300) return done(); setTimeout(look, 2000); });
    })();
  });
}

function cancelJob(job){
  job.cancelling = true; paintJobs();
  call("cancel", {run_id: job.run_id}).then(function(said){
    job.state = said.state;               // "stopping" -- and the page does not block on it
    paintJobs();
  }).catch(function(e){ job.cancelling = false; job.err = e; paintJobs(); });
}

var STATE_WORDS = {
  accepted:["angenommen","p-run"], running:["läuft","p-run"], stopping:["wird abgebrochen","p-warn"],
  finished:["fertig","p-good"], refused:["abgelehnt","p-bad"], cancelled:["abgebrochen","p-warn"],
  unverified:["ohne Bestätigung beendet","p-warn"], interrupted:["unterbrochen","p-warn"]
};

function jobCard(job){
  var w = STATE_WORDS[job.state] || [job.state, "p-run"];
  var running = ["accepted","running","stopping"].indexOf(job.state) >= 0;
  var body = [];
  if(job.out && job.out.stdout) body.push(el("pre", {"class":"out", text: job.out.stdout}));
  if(job.out && job.out.stderr) body.push(el("pre", {"class":"out", text: job.out.stderr}));
  if(job.state === "stopping")
    body.push(el("p", {"class":"faint", text:"Der Abbruch ist angefordert. Fertig heißt er erst, " +
      "wenn die Sandbox bestätigt hat, dass wirklich nichts mehr läuft."}));
  if(job.out && job.out.cleanup_verified === false)
    body.push(el("p", {"class":"faint", text:"Die Sandbox konnte nicht bestätigen, dass alles " +
      "abgeräumt ist. Das wird hier gesagt statt stillschweigend als erledigt gezählt."}));
  if(job.err) body.push(problem(job.err, null));

  return el("li", {"data-run": job.run_id}, [
    el("div", {"class":"who"}, [
      el("b", {text: job.label}),
      el("span", {"class":"faint", text:"Auftrag " + job.run_id.slice(0,8)})
    ]),
    el("div", {"class":"row"}, [
      el("span", {"class":"pill " + w[1], text: w[0]}),
      running && !job.cancelling
        ? el("button", {"class":"b danger", type:"button", "data-cancel": job.run_id,
            text:"Abbrechen", onclick:function(){ cancelJob(job); }})
        : null
    ]),
    body.length ? el("div", {style:"flex-basis:100%"}, body) : null
  ]);
}

function paintJobs(){
  var host = document.getElementById("joblist");
  if(!host) return;
  host.innerHTML = "";
  if(!S.jobs.length){ host.appendChild(el("p", {"class":"muted", text:"Noch keine Aufträge."})); return; }
  var ul = el("ul", {"class":"list"});
  S.jobs.forEach(function(j){ ul.appendChild(jobCard(j)); });
  host.appendChild(ul);
}

function stepFirstJob(){
  function start(){
    S.err = null;
    var btn = document.getElementById("start-job");
    if(btn){ btn.disabled = true; btn.textContent = "Wird gestartet…"; }
    runJob("print('Hallo aus der Sandbox')", "Mein erster Auftrag").then(function(){
      S.step = 9; S.tab = "setup"; render();
    }).catch(function(e){
      S.err = e; render();
    });
  }
  show([
    head("Starten wir etwas Echtes.",
         "Ein kleiner Auftrag, damit Sie einmal den ganzen Weg sehen: starten, zusehen, Ergebnis."),
    el("div", {"class":"card stack"}, [
      S.err ? problem(S.err, function(){ S.err=null; render(); }) : null,
      el("p", {text:"Der Auftrag gibt einen kurzen Text aus. Er läuft in der Sandbox, nicht hier."}),
      el("div", {"class":"row"}, [
        el("button", {"class":"b primary", type:"button", id:"start-job",
          text:"Auftrag starten", onclick:start}),
        el("button", {"class":"b quiet", type:"button", text:"Überspringen",
          onclick:function(){ S.step=9; render(); }})
      ])
    ])
  ]);
}

/* --- the customer area ----------------------------------------------------- */

function overview(){
  var jobs = el("div", {id:"joblist"});
  var usage = el("div", {id:"usagebox"});
  var switchbox = el("div", {id:"switchbox"});

  show([
    el("div", {}, [
      el("h1", {text:"Ihre Sandbox"}),
      el("p", {"class":"lede", text:"Was gerade läuft, was gelaufen ist, und wie viel noch übrig ist."})
    ]),
    el("div", {"class":"card stack"}, [switchbox]),
    el("div", {"class":"card stack"}, [
      el("div", {"class":"spread"}, [
        el("h2", {text:"Aufträge"}),
        el("button", {"class":"b ghost", type:"button", id:"new-job", text:"Neuen Auftrag starten",
          onclick:function(){
            runJob("print('Hallo aus der Sandbox')", "Auftrag").catch(function(e){
              S.err = e; render(); });
            paintJobs();
          }})
      ]),
      jobs
    ]),
    el("div", {"class":"card stack"}, [el("h2", {text:"Verbrauch"}), usage])
  ]);
  paintJobs();
  paintUsage(usage);
  paintSwitch(switchbox);
}

function paintSwitch(host){
  call("capabilities").then(function(caps){
    S.caps = caps; drawFoot();
    host.innerHTML = "";
    var off = caps.accepting_work === false;
    host.appendChild(el("div", {"class":"note " + (off ? "n-warn" : "n-good"), id:"killswitch"}, [
      el("h3", {text: off ? "Der Not-Aus ist gezogen." : "Die Sandbox nimmt Arbeit an."}),
      el("p", {text: off
        ? "Es werden gerade keine neuen Aufträge angenommen. Das ist eine bewusste Entscheidung " +
          "der Person, die die Sandbox betreibt — nicht ein Fehler."
        : "Neue Aufträge sind möglich. Wer die Sandbox betreibt, kann das jederzeit anhalten."})
    ]));
  }).catch(function(e){ host.innerHTML = ""; host.appendChild(problem(e, function(){ render(); })); });
}

function paintUsage(host){
  host.innerHTML = "";
  host.appendChild(el("p", {}, [el("span", {"class":"spin"}), document.createTextNode(" Lädt…")]));
  call("usage", {}).then(function(u){
    host.innerHTML = "";
    var ceil = u.ceilings || {};
    var maxRuns = ceil.runs_per_window || ceil.max_runs || 0;
    var maxSecs = ceil.seconds_per_window || ceil.max_seconds || 0;
    host.appendChild(bar("Aufträge in diesem Zeitfenster", u.runs || 0, maxRuns, ""));
    host.appendChild(bar("Laufzeit in diesem Zeitfenster", u.seconds || 0, maxSecs, " Sek."));
    if(!maxRuns && !maxSecs)
      host.appendChild(el("p", {"class":"faint",
        text:"Für dieses Gerät ist keine Obergrenze gesetzt."}));
  }).catch(function(e){ host.innerHTML=""; host.appendChild(problem(e, function(){ paintUsage(host); })); });
}

function bar(label, used, max, unit){
  var frac = max ? Math.min(1, used/max) : 0;
  var cls = frac >= 1 ? "over" : (frac > .8 ? "hot" : "");
  return el("div", {"class":"nums"}, [
    el("div", {"class":"spread"}, [
      el("span", {text:label}),
      el("span", {"class":"muted", text: max ? (used + " von " + max + unit) : (used + unit)})
    ]),
    max ? el("div", {"class":"meter"}, [el("i", {"class":cls, style:"width:"+(frac*100)+"%"})]) : null,
    max && frac >= 1 ? el("p", {"class":"faint",
      text:"Aufgebraucht. Laufende Aufträge laufen weiter; neue gehen erst wieder, wenn das " +
           "Fenster weiterrückt."}) : null
  ]);
}

function devices(){
  var host = el("div", {id:"devicelist"});
  show([
    el("div", {}, [
      el("h1", {text:"Verbundene Geräte"}),
      el("p", {"class":"lede", text:"Alles, was gerade als Sie mit der Sandbox sprechen darf. " +
        "Zurückziehen wirkt sofort und überall."})
    ]),
    el("div", {"class":"card"}, [host])
  ]);
  loadDevices(host);
}

function loadDevices(host){
  host.innerHTML = "";
  host.appendChild(el("p", {}, [el("span", {"class":"spin"}), document.createTextNode(" Lädt…")]));
  call("devices.list").then(function(d){
    host.innerHTML = "";
    var ul = el("ul", {"class":"list"});
    (d.devices||[]).forEach(function(dev){
      ul.appendChild(el("li", {"data-device": dev.device_id}, [
        el("div", {"class":"who"}, [
          el("b", {text: dev.name || "Unbenanntes Gerät"}),
          el("span", {"class":"faint", text: ago(dev.last_used)})
        ]),
        el("button", {"class":"b danger", type:"button", "data-revoke": dev.device_id,
          text:"Zugang zurückziehen",
          onclick:function(){ revoke(dev, host); }})
      ]));
    });
    host.appendChild(ul);
  }).catch(function(e){ host.innerHTML=""; host.appendChild(problem(e, function(){ loadDevices(host); })); });
}

function revoke(dev, host){
  var mine = dev.name === S.device;
  var warn = el("div", {"class":"note n-warn", id:"revoke-confirm"}, [
    el("h3", {text:"„" + (dev.name||"Dieses Gerät") + "“ wirklich zurückziehen?"}),
    el("p", {text: mine
      ? "Das ist dieses Gerät. Danach müssen Sie sich mit einer neuen Einladung wieder verbinden."
      : "Danach funktioniert nichts mehr, was dieses Gerät gespeichert hat — sofort, auf allen Wegen."}),
    el("div", {"class":"row"}, [
      el("button", {"class":"b danger", type:"button", id:"revoke-yes", text:"Ja, zurückziehen",
        onclick:function(){
          call("devices.revoke", {device_id: dev.device_id}).then(function(){
            if(mine){ forget(); S.step = 0; S.tab = "setup"; render(); }
            else loadDevices(host);
          }).catch(function(e){ host.appendChild(problem(e, null)); });
        }}),
      el("button", {"class":"b quiet", type:"button", text:"Abbrechen",
        onclick:function(){ loadDevices(host); }})
    ])
  ]);
  host.innerHTML = ""; host.appendChild(warn);
}

function safety(){
  var caps = S.caps || {};
  var e = caps.enforces || {};
  var rows = Object.keys(e).map(function(k){
    var WORDS = {network:"Netzzugang", memory:"Arbeitsspeicher", cpu:"Rechenzeit",
                 wall_clock:"Laufzeit", filesystem:"Ihre Dateien"};
    return el("li", {}, [
      el("div", {"class":"who"}, [el("b", {text: WORDS[k] || k})]),
      el("span", {"class":"pill " + (e[k] ? "p-good" : "p-warn"),
        text: e[k] ? "abgeschirmt" : "nicht abgeschirmt"})
    ]);
  });
  show([
    el("div", {}, [
      el("h1", {text:"Sicherheit und Netz"}),
      el("p", {"class":"lede", text:"In klaren Worten, ohne Beschönigung."})
    ]),
    el("div", {"class":"card stack"}, [
      el("h2", {text:"Was gemessen wurde"}),
      rows.length ? el("ul", {"class":"list"}, rows)
                  : el("p", {"class":"muted", text:"Diese Sandbox meldet dazu nichts."})
    ]),
    el("div", {"class":"card stack"}, [
      el("h2", {text:"Was diese Sandbox nicht ist"}),
      el("ul", {}, (caps.what_this_does_not_establish||[]).map(function(l){
        return el("li", {text:l}); }))
    ]),
    el("div", {"class":"card stack"}, [
      el("h2", {text:"Ihr Zugang auf diesem Gerät"}),
      el("p", {text:"Der Zugang gilt nur für dieses Browser-Fenster. Schließen Sie es, ist er " +
                    "weg. Er steht nicht in der Adresszeile und wird nirgends mitprotokolliert."}),
      el("button", {"class":"b danger", type:"button", id:"logout", text:"Von diesem Gerät abmelden",
        onclick:function(){ forget(); S.step=0; S.tab="setup"; S.caps=null; render(); }})
    ])
  ]);
}

/* --- the router ------------------------------------------------------------ */

function render(){
  if(!S.token){
    if(S.step === 0) return stepWelcome();
    if(S.step === 1) return stepInvitation(S.pendingCode);
    if(S.step === 2) return stepName();
    S.step = 0; return stepWelcome();
  }
  if(S.tab === "devices") return devices();
  if(S.tab === "usage"){
    var host = el("div", {id:"usagebox"});
    show([el("div", {}, [el("h1", {text:"Verbrauch"}),
      el("p", {"class":"lede", text:"Was dieses Zeitfenster schon gekostet hat."})]),
      el("div", {"class":"card"}, [host])]);
    return paintUsage(host);
  }
  if(S.tab === "safety") return safety();
  if(S.step === 3) return stepConfirm();
  if(S.step === 4) return stepChoose();
  if(S.step === 5) return stepSetup();
  if(S.step === 6) return stepTest();
  if(S.step === 7) return stepWorks();
  if(S.step === 8) return stepFirstJob();
  return overview();
}

function boot(){
  var carried = codeFromLink();
  if(recall()){
    S.step = 9;
    render();
    call("capabilities").then(function(c){ S.caps = c; drawFoot(); },
      function(e){ forget(); S.step = 0; S.err = e; render(); });
    return;
  }
  if(carried){ S.pendingCode = carried; S.step = 1; return stepInvitation(carried); }
  render();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
