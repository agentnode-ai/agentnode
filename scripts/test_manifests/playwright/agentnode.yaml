manifest_version: "0.3"
package_id: mcp-playwright
name: "Playwright MCP"
package_type: toolpack
runtime: mcp
install_mode: package
version: "0.1.0"
visibility: public
hosting_type: agentnode_hosted
publisher: agentnode-community
summary: "Browser automation via Playwright. Navigate, click, type, screenshot, execute JS."
description: "Full browser automation for AI agents. Chromium auto-downloads on first use."

mcp_server:
  command: ["npx", "-y", "@playwright/mcp@0.0.75", "--headless"]
  transport: stdio
  npm_package: "@playwright/mcp"
  source_repo: "https://github.com/microsoft/playwright-mcp"
  env_keys: []

capabilities:
  tools:
    - name: browser_navigate
      capability_id: web_automation
      description: "Navigate to a URL"
      input_schema: {type: object, properties: {}}
  resources: []
  prompts: []

permissions:
  network: {level: unrestricted}
  filesystem: {level: none}
  code_execution: {level: shell}

tags: [mcp, mcp-server, playwright, browser, automation]
categories: [web-automation]
compatibility: {frameworks: [mcp]}
