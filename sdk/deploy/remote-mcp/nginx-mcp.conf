# nginx for the remote MCP origin https://mcp.agentnode.net (profile R11/R12/R13).
#   * IPv4 443 ONLY: no `listen [::]`, no port 80 at all (renewal is DNS-01).
#   * One named vhost; any other SNI/Host gets the default server, which refuses the handshake.
#   * TLS from the `live` symlink the renewal job swaps atomically.
#   * The MCP/OAuth service and the gateway login stay on loopback behind it.
#   * The proxy-layer limits of the decided limit table (Q-RMCP-0001 §6); the app enforces the
#     rest (see agentnode_sdk/remote_mcp/limits.py).
# LISTEN_ADDR is the public IPv4 in production; the restricted test stand uses a private one.

# "Unauthenticated" = neither a bearer credential nor a gateway browser session: those requests
# share a per-IP budget of 10/min, burst 5. An empty key is not counted.
map $http_cookie $rmcp_has_session {
    default 0;
    "~(^|;\s*)__Host-agentnode=" 1;
}
map "$http_authorization$http_x_access_token:$rmcp_has_session" $rmcp_unauth_key {
    ":0"    $binary_remote_addr;
    default "";
}
limit_req_zone $rmcp_unauth_key zone=rmcp_unauth:10m rate=10r/m;

server {
    listen LISTEN_ADDR:443 ssl default_server;
    ssl_reject_handshake on;          # unknown SNI: no certificate, no content
}

server {
    listen LISTEN_ADDR:443 ssl;
    server_name mcp.agentnode.net;

    ssl_certificate     /etc/agentnode-mcp/tls/live/fullchain.pem;
    ssl_certificate_key /etc/agentnode-mcp/tls/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # header block 16 KiB total, 8 KiB per field; header read 10 s; body 256 KiB read within 15 s
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    client_max_body_size 256k;        # the service enforces 256 KiB too

    limit_req zone=rmcp_unauth burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @rmcp_rate_limited;

    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;      # the service checks Host against its exact allowlist
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;              # streamable HTTP responses pass through as they come
    proxy_read_timeout 135s;          # above the service's 125 s end-to-end call timeout

    # gateway browser login (console + session redeem), same origin for the __Host- cookie
    location = /console { proxy_pass http://127.0.0.1:8099; }
    location /v1/      { proxy_pass http://127.0.0.1:8099; }
    # everything else: PRM, AS metadata, /authorize, /token, /login, /mcp
    location /         { proxy_pass http://127.0.0.1:8800; }

    location @rmcp_rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        return 429 '{"error":"rate_limited"}';
    }
}
