# local-worker slice 2 -- http{} level: the agent path's own limits. NOT INSTALLED by default; activation includes it
# from the http block, beside nginx-mcp.conf. Defence in depth only: identity and slot bounds are rmcp-agent's.
limit_conn_zone $binary_remote_addr zone=agent_conn:10m;
limit_req_zone  $binary_remote_addr zone=agent_slot:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=agent_pair:10m rate=30r/m;
