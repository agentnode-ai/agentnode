# Installed by trust-timers.sh beside the unchanged rmcp-cert-check.service (trust-refresh C5): the
# daily certificate check, which has its own schedule and its own alert, also checks that the trust
# WATCHDOG's timer is loaded, enabled, active and has a finite next run. The refresh is never the one
# that watches the watchdog. A failure here fails rmcp-cert-check.service -> rmcp-alert@.
[Service]
ExecStart=/opt/agentnode/venv/bin/python -m agentnode_sdk.remote_mcp.trust_watchdog timer-check --unit rmcp-trust-watchdog.timer --bound-seconds 3900
