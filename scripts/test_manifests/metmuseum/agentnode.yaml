agentnode: "0.1"
name: "Met Museum MCP"
summary: "Search and browse The Metropolitan Museum of Art Collection."

package:
  registry: npm
  name: metmuseum-mcp
  version: "1.0.0"

transport: stdio
command: ["npx", "-y", "metmuseum-mcp@1.0.0"]

permissions:
